<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="%VIEWPORT_CONTENT%"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="kod" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="kod" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>KOD iOS Debug</title>
    <!-- Error capture: install BEFORE the app module loads so runtime errors
         during module evaluation are recorded and surfaced in the DOM. -->
    <script>
      window.__CAPTURED_ERRORS__ = [];
      function recordError(kind, ev) {
        try {
          var detail = ev && ev.error ? (ev.error.stack || String(ev.error)) : (ev && ev.message ? ev.message : String(ev));
          window.__CAPTURED_ERRORS__.push(kind + ': ' + detail);
        } catch (e) {
          window.__CAPTURED_ERRORS__.push(kind + ': <unserializable>');
        }
        renderErrors();
      }
      window.addEventListener('error', function (ev) { recordError('error', ev); });
      window.addEventListener('unhandledrejection', function (ev) { recordError('unhandledrejection', { error: ev.reason, message: String(ev.reason) }); });
      var origError = console.error;
      console.error = function () {
        try {
          var args = Array.prototype.slice.call(arguments).map(function (a) {
            return a && a.stack ? a.stack : String(a);
          });
          window.__CAPTURED_ERRORS__.push('console.error: ' + args.join(' '));
        } catch (e) {}
        renderErrors();
        return origError.apply(console, arguments);
      };
      function renderErrors() {
        var box = document.getElementById('__error_box__');
        if (!box) return;
        box.textContent = window.__CAPTURED_ERRORS__.join('\n\n---\n\n');
      }
    </script>

    <script>
      window.plausible =
        window.plausible ||
        function () {
          (window.plausible.q = window.plausible.q || []).push(arguments);
        };
    </script>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
    </script>
    <script>
      var initialTheme = localStorage.getItem("initial-theme");
      if (initialTheme === "light" || initialTheme === "dark") {
        document.documentElement.setAttribute("data-theme", initialTheme);
        document.documentElement.setAttribute(
          "data-mantine-color-scheme",
          initialTheme
        );
      }
    </script>
    <style>
      html[data-theme="dark"] {
        background-color: #242424;
      }

      .splash-screen {
        position: fixed;
        z-index: 99999;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 1;
        background-color: #fff;
        overflow: hidden;
      }
      html[data-theme="dark"] .splash-screen {
        background-color: #242424;
      }

      .splash-screen-top {
        flex: 2;
      }
      .splash-screen-bottom {
        flex: 3;
        width: 100%;
        position: relative;
      }
      .splash-screen-content {
        flex: 0 0 auto;
        position: relative;
      }

      .splash-screen-logo {
        display: block;
        color: #495057;
      }
      html[data-theme="dark"] .splash-screen-logo {
        color: #ced4da;
      }

      .splash-screen-kod-logo {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 48px;
        letter-spacing: -2px;
        line-height: 1;
        text-align: center;
      }
      .splash-screen-kod-k {
        color: #228be6;
      }
      .splash-screen-kod-od {
        color: #495057;
      }
      html[data-theme="dark"] .splash-screen-kod-od {
        color: #ced4da;
      }
      .splash-screen-kod-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 14px;
        color: #868e96;
        letter-spacing: 4px;
        text-align: center;
        margin-top: 2px;
      }
      html[data-theme="dark"] .splash-screen-kod-subtitle {
        color: #adb5bd;
      }

      .splash-screen-logo-bg {
        position: absolute;
        z-index: -1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #dee2e6;
      }
      html[data-theme="dark"] .splash-screen-logo-bg {
        color: #495057;
      }

      /* Error display box: visible above the splash screen so failures are
         surfaced even before the app mounts. */
      #__error_box__ {
        position: fixed;
        z-index: 1000000;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 50vh;
        overflow: auto;
        padding: 8px 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
        color: #fff;
        background: rgba(180, 30, 30, 0.92);
        display: none;
      }
      #__error_box__:not(:empty) {
        display: block;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <pre id="__error_box__"></pre>
    <div class="splash-screen">
      <div class="splash-screen-top"></div>
      <div class="splash-screen-content">
        <div class="splash-screen-kod-logo">
          <span class="splash-screen-kod-k">K</span><span class="splash-screen-kod-od">OD</span>
        </div>
        <div class="splash-screen-kod-subtitle">蒜粒 (iOS debug)</div>
      </div>
      <div class="splash-screen-bottom" id="log-root"></div>
    </div>
    <!-- Bootstrap the SQLite web store (and stub Keyboard) BEFORE the app
         module runs. A single entry module uses sequenced dynamic imports with
         top-level await so index.tsx does not start until the SQLite web store
         is ready. (Two separate <script type=module> tags do NOT gate each
         other via top-level await — they are independent module graphs.) -->
    <script type="module">
      await import('./setup/ios_web_preview_init.ts');
      await import('./index.tsx');
    </script>
  </body>
</html>
